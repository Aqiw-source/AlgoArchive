name: Windows verification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: windows-latest
    outputs:
      full_layout: ${{ steps.classify.outputs.full_layout }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        shell: pwsh
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .\scripts\classify-workflow-changes.ps1 -BaseRevision $env:DIFF_BASE

  regression:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/regression.yml
    with:
      full_layout: ${{ needs.changes.outputs.full_layout == 'true' }}

  package:
    needs: [changes, regression]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (needs.regression.result == 'success' ||
       (needs.changes.outputs.docs_only == 'true' && needs.regression.result == 'skipped'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check documentation links, notices, and current downloads
        shell: pwsh
        run: .\scripts\check-docs.ps1
      - name: Prepare bundled Python runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "python-3.13.9-embed-amd64.zip"
          $expected = "91d828c2da3a029b41699e918674a0cb379c02cf20dab9c501306885f837402a"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.13.9/python-3.13.9-embed-amd64.zip" -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
              throw "Python runtime SHA-256 mismatch: $actual"
          }
          New-Item -ItemType Directory -Path ".\runtime" -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath ".\runtime" -Force
      - name: Build portable package
        shell: pwsh
        run: .\scripts\build-portable.ps1
      - name: Verify release privacy and contents
        shell: pwsh
        run: .\scripts\verify-release.ps1 -ArchivePath (Get-ChildItem .\dist\*.zip | Select-Object -First 1).FullName
