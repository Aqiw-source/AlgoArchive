name: Windows verification

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Backend tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Frontend syntax
        run: node --check web/app.js
      - name: Prepare bundled Python runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "python-3.13.9-embed-amd64.zip"
          $expected = "91d828c2da3a029b41699e918674a0cb379c02cf20dab9c501306885f837402a"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.13.9/python-3.13.9-embed-amd64.zip" -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
              throw "Python runtime SHA-256 mismatch: $actual"
          }
          New-Item -ItemType Directory -Path ".\runtime" -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath ".\runtime" -Force
      - name: Build portable package
        shell: pwsh
        run: .\scripts\build-portable.ps1
      - name: Verify release privacy and contents
        shell: pwsh
        run: .\scripts\verify-release.ps1 -ArchivePath (Get-ChildItem .\dist\*.zip | Select-Object -First 1).FullName
